<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0a">
  <meta name="description" content="Calculadora de RPM y avance para fresas, brocas y machos.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'sha256-DsOmixYqsaKuw/adK9AnYtzlLEFYqpAzTYSuJBnIEck='; script-src 'sha256-rEuK63Ik7VRzD/F9P77YG6Rqw8v3Su5atP4orAsqaso='; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>CNC</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CNC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
/* CNC — estilos. Todos los colores son variables: para rediseñar se cambia este bloque. */
:root {
  --bg: #0b0c0a; --card: #161814; --card2: #1c1f19; --borde: #2a2e26; --linea: #20231d;
  --txt: #f1f3ec; --mut: #8d9386; --lima: #c8e05a; --lima2: #9fb83a;
  --ambar: #f2b33d; --rojo: #ff7a6b; --radio: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-feature-settings: "calt" 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body {
  color: var(--txt); font: 15px/1.35 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100dvh; padding-bottom: calc(90px + env(safe-area-inset-bottom));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
input, select { background: transparent; border: 0; outline: 0; width: 100%; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
:focus-visible { outline: 2px solid var(--lima); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; flex-shrink: 0; }
[hidden] { display: none !important; }

main { max-width: 520px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 18px 0; }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 36px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--lima); color: #111; display: grid; place-items: center; }
.top h1 { font-size: 20px; font-weight: 700; flex: 1; }
.ibtn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--borde); display: grid; place-items: center; color: var(--mut); font-size: 20px; }
h2 { font-size: 22px; font-weight: 700; }
.sub { color: var(--mut); font-size: 12.5px; margin: 2px 0 12px; }
.maq { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--borde); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.maq i { width: 8px; height: 8px; border-radius: 50%; background: var(--lima); }
.agr { background: var(--lima); color: #111; font-weight: 700; font-size: 13px; border-radius: 999px; padding: 8px 14px; }

.card { background: var(--card); border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px 14px; margin-bottom: 10px; }
.sel { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; }
.sel .k, .k { font-size: 11px; color: var(--mut); }
.sel .v { font-size: 14.5px; font-weight: 600; }
.d { font-size: 11.5px; color: var(--mut); }
.cod { color: var(--lima); font-size: 13.5px; font-weight: 700; letter-spacing: .2px; }
.chev { margin-left: auto; color: var(--mut); font-size: 18px; }
.icn { width: 38px; height: 38px; border-radius: 12px; background: var(--card2); border: 1px solid var(--borde); display: grid; place-items: center; flex-shrink: 0; color: var(--lima); }
.punto { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,.15); }
.badge { font-size: 10.5px; padding: 3px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.b-sug { background: rgba(242,179,61,.15); color: var(--ambar); }
.b-ok { background: rgba(200,224,90,.15); color: var(--lima); }

.res { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.res .card { margin: 0; }
.lbl { font-size: 11.5px; color: var(--mut); margin-bottom: 2px; }
.big { font-size: 32px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.big small { font-size: 12px; color: var(--mut); font-weight: 500; margin-left: 3px; letter-spacing: 0; }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini .card { margin: 0; padding: 10px; }
.mini input { font-size: 17px; font-weight: 700; padding: 0; }
.mini .card.editado { border-color: var(--lima2); }
.mini .card:focus-within { border-color: var(--lima); }
.aviso { font-size: 12px; color: var(--ambar); background: rgba(242,179,61,.1); border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
.error { font-size: 12.5px; color: var(--rojo); background: rgba(255,122,107,.1); border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
.enlace { color: var(--lima); font-size: 12.5px; text-decoration: underline; padding: 8px 0 0; }
.btn2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.btn2 button { border: 1px solid var(--lima); color: var(--lima); border-radius: 14px; padding: 12px 0; font-size: 14px; font-weight: 700; }
.btn2 .ll { background: var(--lima); color: #111; }
.primario { display: block; width: 100%; background: var(--lima); color: #111; font-weight: 700; text-align: center; border-radius: 14px; padding: 13px; font-size: 14.5px; }
.vacio { text-align: center; color: var(--mut); padding: 30px 10px; font-size: 14px; }
.vacio .primario { margin-top: 14px; }

.campos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.campos.c3 { grid-template-columns: repeat(3, 1fr); gap: 6px; }
.campo { background: var(--card); border: 1px solid var(--borde); border-radius: 12px; padding: 7px 10px; display: block; }
.campo:focus-within { border-color: var(--lima); }
.campo input, .campo select { font-size: 16px; font-weight: 600; padding: 2px 0 0; }
.campo select option { background: var(--card); }
.campo.resaltado { border-color: var(--lima); }

.buscar { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--borde); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 10px; color: var(--mut); }
.buscar input { color: var(--txt); }
.chips { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { font-size: 12.5px; border: 1px solid var(--borde); border-radius: 999px; padding: 6px 12px; color: var(--mut); white-space: nowrap; }
.chips button[aria-pressed="true"] { background: var(--lima); color: #111; border-color: var(--lima); font-weight: 600; }
.grp { font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .8px; margin: 12px 2px 6px; }
.tool { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--borde); border-radius: 16px; padding: 10px 12px; margin-bottom: 8px; }
.tool .estrella { margin-left: auto; color: var(--lima); }
.item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--linea); }
.item.activo { background: rgba(200,224,90,.07); border-radius: 12px; border-bottom-color: transparent; }
.item .v { font-size: 14px; font-weight: 600; }
.item .der { margin-left: auto; }
.btnl { display: block; width: 100%; text-align: center; border: 1px dashed var(--lima2); color: var(--lima); border-radius: 14px; padding: 12px; font-size: 13.5px; font-weight: 600; margin-top: 12px; }

/* Ficha */
.foto { height: 150px; border-radius: 18px; background: linear-gradient(135deg, #20241c, #14170f); border: 1px solid var(--borde); display: grid; place-items: center; margin-bottom: 12px; overflow: hidden; color: var(--lima); }
.foto img { width: 100%; height: 100%; object-fit: cover; }
.foto svg { width: 70px; height: 70px; opacity: .8; }
.tagcod { display: inline-block; font-size: 12.5px; font-weight: 700; background: rgba(200,224,90,.13); color: var(--lima); padding: 4px 9px; border-radius: 8px; margin-bottom: 6px; }
.specs { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border: 1px solid var(--borde); border-radius: 16px; margin-bottom: 10px; overflow: hidden; }
.specs > div { padding: 9px 12px; border-bottom: 1px solid var(--linea); }
.specs > div:nth-child(odd) { border-right: 1px solid var(--linea); }
.specs .v { font-size: 14px; font-weight: 600; }
.acc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.acc button { border: 1px solid var(--borde); border-radius: 12px; padding: 10px 0; font-size: 13px; }
.acc .del { color: var(--rojo); }

/* Barra inferior */
.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; background: #111310; border-top: 1px solid var(--borde); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 6px 0 calc(10px + env(safe-area-inset-bottom)); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; color: var(--mut); padding: 4px 0; }
.nav button[aria-current="page"] { color: var(--lima); }
.nav .mas { width: 58px; height: 58px; border-radius: 50%; background: var(--lima); color: #111; display: grid; place-items: center; margin: -30px auto 0; box-shadow: 0 0 0 6px var(--bg); }
.nav .mas svg { width: 27px; height: 27px; }

/* Hojas que suben desde abajo */
.velo { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; opacity: 0; transition: opacity .2s; }
.hoja { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 92dvh; overflow-y: auto; background: #141612; border-top: 1px solid var(--borde); border-radius: 26px 26px 0 0; padding: 10px 18px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s ease; max-width: 560px; margin: 0 auto; }
.hoja.abierta { transform: none; }
.velo.abierta { opacity: 1; }
.asa { width: 40px; height: 4px; border-radius: 4px; background: #3a3f35; margin: 0 auto 12px; }
.hoja h3 { font-size: 17px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hoja h3 .x { color: var(--mut); font-size: 20px; padding: 0 4px; }
.hoja h3 .cuenta { font-size: 13px; color: var(--mut); font-weight: 500; }

/* Formulario de herramienta */
.paso { font-size: 11.5px; color: var(--mut); margin: 4px 0 5px; }
.formas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
.formas button { background: var(--card); border: 1px solid var(--borde); border-radius: 14px; padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; color: var(--mut); }
.formas button[aria-pressed="true"] { border-color: var(--lima); color: var(--txt); background: rgba(200,224,90,.07); }
.formas button[aria-pressed="true"] svg { color: var(--lima); }
.foto3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
.foto3 label { border: 1px dashed var(--lima2); border-radius: 12px; padding: 7px 4px; text-align: center; font-size: 10.5px; line-height: 1.25; cursor: pointer; }
.foto3 label b { display: block; font-size: 16px; color: var(--lima); }
.miniatura { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--borde); border-radius: 12px; padding: 6px; margin-bottom: 8px; font-size: 12.5px; }
.miniatura img { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; }
.miniatura button { margin-left: auto; color: var(--rojo); font-size: 12.5px; padding: 6px 8px; }
.punta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.punta button { border: 1px solid var(--borde); border-radius: 12px; padding: 9px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mut); text-align: left; }
.punta button[aria-pressed="true"] { border-color: var(--lima); color: var(--txt); background: rgba(200,224,90,.07); }
.codprev { background: rgba(200,224,90,.08); border: 1px solid rgba(200,224,90,.35); border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; display: block; }
.codprev input { color: var(--lima); font-size: 16px; font-weight: 700; }
.avm { font-size: 12px; color: var(--ambar); background: rgba(242,179,61,.12); border: 1px solid rgba(242,179,61,.3); border-radius: 12px; padding: 9px 11px; margin-bottom: 8px; line-height: 1.35; }

/* Pantalla "próxima etapa" */
.pronto { text-align: center; padding: 60px 20px; color: var(--mut); }
.pronto svg { width: 54px; height: 54px; color: var(--lima); margin-bottom: 14px; }
.pronto h2 { color: var(--txt); margin-bottom: 6px; }

#toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40; background: var(--txt); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100vw - 32px); text-align: center; }
#toast.visible { opacity: 1; }
.sprite { position: absolute; width: 0; height: 0; }
.sel .der { margin-left: auto; } .sel .der + .chev { margin-left: 6px; }
.nav .mas, .nav .mas[aria-current] { color: #111; }
.campo input:focus-visible, .campo select:focus-visible, .mini input:focus-visible, .codprev input:focus-visible, .buscar input:focus-visible { outline: none; }
.codprev:focus-within { border-color: var(--lima); }

/* Estrategia de corte */
.est-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 13.5px; }
.sw-etq { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--mut); }
.sw { width: 40px; height: 22px; border-radius: 999px; background: #33382e; position: relative; flex-shrink: 0; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--mut); transition: left .15s; }
.sw[aria-checked="true"] { background: var(--lima); }
.sw[aria-checked="true"]::after { left: 21px; background: #111; }
.fila-v { display: flex; align-items: baseline; gap: 4px; }
.fila-v input { min-width: 0; }
.q { font-size: 11px; color: var(--mut); white-space: nowrap; }
.medidor { height: 5px; border-radius: 5px; background: #2a2e26; margin-top: 5px; position: relative; overflow: hidden; }
.medidor i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--lima); }
.medidor i.am { background: var(--ambar); } .medidor i.ro { background: var(--rojo); }
.ok { color: var(--lima); } .am { color: var(--ambar); } .ro { color: var(--rojo); }
.dib-fila { display: flex; gap: 12px; align-items: center; background: var(--card2); border-radius: 12px; padding: 8px; }
.dibujo { display: block; } .d-mat { fill: #2a2e26; } .d-hueco { fill: rgba(242,179,61,.18); stroke: var(--ambar); stroke-width: 1; stroke-dasharray: 2 2; } .d-fresa { fill: none; stroke: var(--lima); stroke-width: 1.6; }
.d-cono { fill: #5b6156; } .d-ap { fill: var(--ambar); font-size: 9px; } .d-ae { fill: var(--lima); font-size: 9px; }
.mini + .mini { margin-top: 8px; }
.mini .v.am { color: var(--ambar); } .mini .v.ro { color: var(--rojo); }
.ayuda { align-self: center; line-height: 1.3; }

/* Materiales */
.punto.grande { width: 18px; height: 18px; }
.punto.enorme { width: 64px; height: 64px; box-shadow: 0 0 0 4px rgba(255,255,255,.06); }
.tool .der { margin-left: auto; }
.titulo-mat { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sec { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; margin: 12px 0 6px; color: var(--txt); }
.sec svg { width: 17px; height: 17px; color: var(--lima); }
.nota { margin: -2px 2px 10px; }
.hrow { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--borde); border-radius: 14px; padding: 10px 12px; margin: 8px 0 10px; }
.hrow .v { font-size: 13.5px; font-weight: 600; }
.colores { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.colores button { width: 28px; height: 28px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,255,255,.18) inset; }
.colores button[aria-checked="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--lima); }
.fotobtn { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--lima2); border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; font-size: 13px; cursor: pointer; }
.fotobtn b { color: var(--lima); font-size: 16px; }
.fotobtn i { color: var(--mut); }
.hoja .chips { margin-bottom: 8px; }

/* Uso de la fresa */
.k .marca { color: var(--mut); font-weight: 400; }
.campo.editado { border-color: var(--lima2); }
.campo.editado .marca { color: var(--lima); }
.uso-caja { margin-top: 4px; }
.uso-tit { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; margin: 2px 2px 6px; }
.uso-tit .enlace { padding: 0; }
.usos { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.uso-fila { display: flex; justify-content: space-between; font-size: 12px; }
.uso-fila b { font-size: 13px; }
.medidor.grande { height: 7px; overflow: visible; }
.medidor .tope { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--txt); border-radius: 2px; }
.uso .q { display: block; margin-top: 3px; white-space: normal; line-height: 1.25; }
.v.notas { font-size: 13px; font-weight: 500; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Historial */
.hfila { display: flex; align-items: stretch; gap: 6px; margin-bottom: 7px; }
.hrow.hist { flex: 1; min-width: 0; margin: 0; text-align: left; width: 100%; }
.hinfo { flex: 1; min-width: 0; }
.hinfo .cod { font-size: 12.5px; overflow-wrap: anywhere; }
.hrow .r { text-align: right; flex-shrink: 0; }
.hrow .r b { font-size: 15px; }
.hrow .r div { font-size: 11px; color: var(--mut); white-space: nowrap; }
.quitar { width: 40px; flex-shrink: 0; border: 1px solid var(--borde); border-radius: 14px; color: var(--mut); font-size: 13px; }
.enlace-sutil { color: var(--mut); font-size: 12.5px; padding: 6px 2px; }
.d.am { color: var(--ambar); }

/* Compartir */
.pdf-vista { background: #fff; border-radius: 12px; overflow: hidden; margin-bottom: 12px; min-height: 120px; display: grid; place-items: center; }
.pdf-vista img { width: 100%; display: block; }
.pdf-vista .vacio { color: #6b7264; }
.op { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--borde); border-radius: 14px; padding: 11px 12px; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--txt); text-decoration: none; }
.op small { display: block; font-size: 11.5px; color: var(--mut); font-weight: 400; }
.op .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
.op .wsp { background: #25d366; color: #fff; } .op .lima { background: var(--lima); color: #111; } .op .gris { background: var(--card2); border: 1px solid var(--borde); }
.respaldo { width: 100%; background: var(--card); color: var(--txt); border: 1px solid var(--borde); border-radius: 12px; padding: 10px; font: 13px/1.4 inherit; }

/* Ajustes */
.ajt { font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .8px; margin: 14px 2px 6px; }
.aj { background: var(--card); border: 1px solid var(--borde); border-radius: 16px; overflow: hidden; }
.aj-fila { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px; border-bottom: 1px solid var(--linea); font-size: 14px; min-height: 50px; }
.aj > .aj-fila:last-child { border-bottom: 0; }
.aj-ico { width: 22px; text-align: center; color: var(--mut); flex-shrink: 0; }
.aj-tit { flex: 1; min-width: 0; }
.aj-tit small { display: block; font-size: 11px; color: var(--mut); }
.aj-fila .r { color: var(--mut); font-size: 12px; text-align: right; }
.aj-fila .chev { margin-left: 2px; font-size: 18px; }
.pto { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--mut); }
.pto.on { background: var(--lima); }
.version { color: var(--mut); font-size: 11.5px; text-align: center; margin: 18px 0 8px; }
.campos.c4 { grid-template-columns: repeat(4, 1fr); gap: 6px; }
.campos.c4 .campo { padding: 6px 8px; }
.campos.c4 .k { font-size: 10px; }
.rango .sec { flex-wrap: wrap; }
.btn-peligro { display: block; width: 100%; margin-top: 10px; border: 1px solid var(--rojo); color: var(--rojo); border-radius: 14px; padding: 12px; font-weight: 700; font-size: 14px; }
.btn-peligro.lleno { background: var(--rojo); color: #1a0705; }
label.op { cursor: pointer; }
a.aj-fila { color: var(--txt); text-decoration: none; }

/* Tamaño fijo: sin zoom por pellizco ni doble toque */
html, body { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.buscar input { font-size: 16px; }

/* v1.2: notas de corte, PIN y aviso de versión */
.hoja .chips { flex-wrap: wrap; }
.campo textarea { background: transparent; border: 0; outline: 0; width: 100%; resize: vertical; font: inherit; font-size: 16px; color: var(--txt); padding: 2px 0 0; }
.d.estado.ok { color: var(--lima); }
.aviso-link { display: block; width: 100%; text-align: center; margin-top: 4px; }
.pin { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
.pin .logo { font-weight: 800; font-size: 22px; color: #111; background: var(--lima); border-radius: 16px; padding: 10px 16px; }
.pin-in { width: 180px; text-align: center; font-size: 30px; letter-spacing: 14px; background: var(--card); border: 1px solid var(--borde); border-radius: 14px; padding: 12px; color: var(--txt); }
.pin-msg { color: var(--rojo); font-size: 13px; min-height: 18px; }
.nueva-version { position: fixed; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 900; display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--lima); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; }
.nueva-version span { flex: 1; }
.nueva-version button { background: var(--lima); color: #111; font-weight: 700; border-radius: 999px; padding: 8px 14px; }

</style>
